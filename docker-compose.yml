name: casajunta

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: casajunta
      POSTGRES_USER: casajunta_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD no .env}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casajunta_owner -d casajunta"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: flyway/flyway:13.9.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/casajunta
      FLYWAY_USER: casajunta_owner
      FLYWAY_PASSWORD: ${DB_OWNER_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/project/migrations,filesystem:/flyway/project/callbacks,filesystem:/flyway/project/seed
      FLYWAY_PLACEHOLDERS_APPDBUSER: ${APP_DB_USER:?defina APP_DB_USER no .env}
      FLYWAY_PLACEHOLDERS_APPDBPASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
    volumes:
      - ./db:/flyway/project:ro

volumes:
  pgdata:
